name: Check patches and host tests

# Cheap checks that need no PS4 toolchain:
#   - the 27 patches in patches/eden/ still apply, in order, to the Eden commit this port is based on;
#   - the host tests in tests/ build and pass;
#   - the presentation sources of Eden (after the patches) are kept as the "eden-sources" artifact,
#     which is what the colour fix is written against.
# The PS4 build itself is the "Build PS4 package" workflow.

on:
  push:
    branches: [main]
    paths:
      - 'patches/**'
      - 'scripts/**'
      - 'ci/**'
      - 'frontend/heap_census.cpp'
      - 'frontend/menu/**'
      - 'tests/**'
      - '.github/workflows/check-patches.yml'
  pull_request:
  workflow_dispatch:

jobs:
  patches:
    name: Patches apply to Eden
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Git identity (git am needs one)
        run: |
          git config --global user.name  "ci"
          git config --global user.email "ci@localhost"
      - name: Fetch Eden at the pinned commit and apply the patches
        run: bash scripts/fetch-eden.sh
      - name: Summary
        run: |
          {
            echo "### Patches applied on top of Eden"
            echo '```'
            git -C deps/eden log --oneline | head -40
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      # The presentation sources of Eden (for the colour fix) are kept only when the workflow is run
      # by hand ("Run workflow"), so ordinary pushes leave no extra files behind.
      - name: Collect the presentation sources of Eden
        if: github.event_name == 'workflow_dispatch'
        run: bash ci/collect-eden-sources.sh
      - name: Upload them
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: eden-sources
          path: eden-sources/
          retention-days: 14

  host-tests:
    name: Host tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Heap census (frontend/heap_census.cpp)
        run: |
          W="-Wl,--wrap=malloc -Wl,--wrap=calloc -Wl,--wrap=realloc -Wl,--wrap=free -Wl,--wrap=posix_memalign -Wl,--wrap=aligned_alloc"
          g++ -O2 -std=c++20 -Wall -Wextra -fno-omit-frame-pointer -pthread \
              tests/heap_census_test.cpp frontend/heap_census.cpp -o heap_census_test $W
          ./heap_census_test
      - name: "Menu (frontend/menu/) - settings.txt, navigation, every screen drawn"
        run: |
          g++ -O2 -std=c++20 -Wall -Wextra -Ifrontend tests/menu_test.cpp frontend/menu/menu_ui.cpp \
              frontend/menu/settings_model.cpp frontend/menu/menu_canvas.cpp -o menu_test
          ./menu_test

  ci-scripts:
    name: CI scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax of every script
        run: |
          for f in ci/*.sh scripts/*.sh tools/*.sh configure-eden.sh package-eden.sh; do
            bash -n "$f" && echo "ok  $f"
          done
      - name: Release notes can be cut from the CHANGELOG
        run: |
          v="$(sed -n 's/^set(EDEN_PS4_VERSION "\([^"]*\)".*/\1/p' frontend/frontend.cmake)"
          echo "frontend version: $v"
          bash ci/release-notes.sh "$v" | head -n 20
